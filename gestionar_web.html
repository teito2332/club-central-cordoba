<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Web - Central Córdoba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">⬅ Volver al Panel</a>
        </div>
    </nav>

    <div class="container mt-5 pb-5">
        <div class="row justify-content-center g-4">
            <!-- Formulario de Noticias -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="mb-4">📰 Redactar Nueva Noticia</h3>
                        <form id="formNoticia">
                            <div class="mb-3">
                                <label class="form-label">Título de la nota</label>
                                <input type="text" id="titulo" class="form-control" placeholder="Ej: Nueva camiseta oficial..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL de la Imagen de portada</label>
                                <input type="url" id="imagenUrl" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cuerpo de la noticia</label>
                                <textarea id="contenido" class="form-control" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Publicar en la Web</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Formulario de Jugadores -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="mb-4">⚽ Agregar Jugador Destacado</h3>
                        <form id="formJugador">
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" id="nombreJugador" class="form-control" placeholder="Ej: Marcos Silva" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Posición</label>
                                <input type="text" id="posicionJugador" class="form-control" placeholder="Ej: Defensor Central" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL de la Foto</label>
                                <input type="url" id="fotoJugador" class="form-control" placeholder="https://ejemplo.com/foto.jpg" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Agregar al Plantel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuarioClub'));
        if (!usuario || usuario.rolId !== 1) {
            alert("Acceso denegado.");
            window.location.href = 'dashboard.html';
        }

        // POST para Noticias
        document.getElementById('formNoticia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('titulo').value;
            const imagenUrl = document.getElementById('imagenUrl').value;
            const contenido = document.getElementById('contenido').value;

            try {
                const response = await fetch('https://localhost:7289/api/Noticias', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo, contenido, imagenUrl, autorId: usuario.id })
                });

                if (response.ok) {
                    alert('¡Noticia publicada!');
                    document.getElementById('formNoticia').reset();
                } else alert('Error al publicar.');
            } catch (error) { console.error(error); }
        });

        // POST para Jugadores
        document.getElementById('formJugador').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombreCompleto = document.getElementById('nombreJugador').value;
            const posicion = document.getElementById('posicionJugador').value;
            const imagenUrl = document.getElementById('fotoJugador').value;

            try {
                const response = await fetch('https://localhost:7289/api/Jugadores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombreCompleto, posicion, imagenUrl })
                });

                if (response.ok) {
                    alert('¡Jugador agregado al plantel!');
                    document.getElementById('formJugador').reset();
                } else alert('Error al agregar jugador.');
            } catch (error) { console.error(error); }
        });
    </script>
</body>
</html>
