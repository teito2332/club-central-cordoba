<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Club - Central Córdoba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .login-container { max-width: 400px; margin-top: 10vh; }
        .btn-dorado { background-color: #c5a059; color: #000; font-weight: bold; border: none; }
        .btn-dorado:hover { background-color: #b08d4a; color: #fff; }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5 text-center">
                <!-- Aquí cargamos tu logo real -->
                <img src="image.png" alt="Logo CADCC" class="img-fluid mb-3" style="max-width: 140px;">
                <h4 class="mb-4 fw-bold">Acceso Institucional</h4>
                
                <form id="loginForm" class="text-start">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">CORREO ELECTRÓNICO</label>
                        <input type="email" id="email" class="form-control" placeholder="admin@club.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">CONTRASEÑA</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    
                    <div id="alertMessage" class="alert d-none text-center" role="alert"></div>
                    
                    <button type="submit" class="btn btn-dorado w-100 mt-3 py-2">INICIAR SESIÓN</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertMessage');
            
            const apiUrl = 'https://localhost:7289/api/Auth/login'; 

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success mt-3';
                    alertBox.textContent = `¡Bienvenido, ${data.usuario.nombre}! Accediendo al panel...`;
                    localStorage.setItem('usuarioClub', JSON.stringify(data.usuario));
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                } else {
                    alertBox.className = 'alert alert-danger mt-3';
                    alertBox.textContent = data.mensaje || 'Credenciales incorrectas';
                }
            } catch (error) {
                alertBox.className = 'alert alert-danger mt-3';
                alertBox.textContent = 'Error de conexión con el servidor.';
            }
            alertBox.classList.remove('d-none');
        });
    </script>
</body>
</html>
