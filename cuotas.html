<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cuotas - Central Córdoba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">⬅ Volver al Panel</a>
            <span class="text-white" id="nombreAdmin">Cargando...</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="mb-4">💰 Consultar y Pagar Cuotas</h3>
                        
                        <!-- Buscador de Socio -->
                        <div class="input-group mb-4">
                            <span class="input-group-text">ID de Socio/Jugador</span>
                            <input type="number" id="inputIdUsuario" class="form-control" value="1" placeholder="Ej: 1">
                            <button class="btn btn-primary" onclick="buscarDeudas()">Buscar Deudas</button>
                        </div>

                        <!-- Contenedor de Alertas -->
                        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

                        <!-- Tabla de Cuotas -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle d-none" id="tablaCuotas">
                                <thead class="table-light">
                                    <tr>
                                        <th>Periodo</th>
                                        <th>Vencimiento</th>
                                        <th>Monto</th>
                                        <th>Estado</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoTabla">
                                    <!-- Las filas se llenan con JavaScript -->
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Verificamos si es administrador
        const usuario = JSON.parse(localStorage.getItem('usuarioClub'));
        if (!usuario || usuario.rolId !== 1) {
            alert("Acceso denegado. Solo administradores.");
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('nombreAdmin').textContent = `Admin: ${usuario.nombre}`;
        }

        // Puerto de tu API
        const apiUrl = 'https://localhost:7289/api/Cuotas';

        // 2. Función para buscar las deudas
        async function buscarDeudas() {
            const usuarioId = document.getElementById('inputIdUsuario').value;
            const alerta = document.getElementById('mensajeAlerta');
            const tabla = document.getElementById('tablaCuotas');
            const tbody = document.getElementById('cuerpoTabla');

            if (!usuarioId) return;

            try {
                const response = await fetch(`${apiUrl}/pendientes/${usuarioId}`);
                const data = await response.json();

                tbody.innerHTML = ''; // Limpiamos la tabla

                if (data.deudas && data.deudas.length > 0) {
                    alerta.className = 'alert alert-warning';
                    alerta.textContent = data.mensaje;
                    alerta.classList.remove('d-none');
                    tabla.classList.remove('d-none');

                    data.deudas.forEach(cuota => {
                        const fila = `
                            <tr>
                                <td>Mes ${cuota.mes} - ${cuota.anio}</td>
                                <td>${cuota.fechaVencimiento}</td>
                                <td>$${cuota.monto}</td>
                                <td><span class="badge ${cuota.estado === 'Vencida' ? 'bg-danger' : 'bg-warning text-dark'}">${cuota.estado}</span></td>
                                <td>
                                    <button class="btn btn-success btn-sm" onclick="pagarCuota(${cuota.id})">Cobrar</button>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += fila;
                    });
                } else {
                    alerta.className = 'alert alert-success';
                    alerta.textContent = 'El socio no registra deudas pendientes.';
                    alerta.classList.remove('d-none');
                    tabla.classList.add('d-none');
                }
            } catch (error) {
                console.error("Error al buscar cuotas:", error);
            }
        }

        // 3. Función para pagar
        async function pagarCuota(cuotaId) {
            if(!confirm('¿Confirmas el pago de esta cuota?')) return;

            try {
                const response = await fetch(`${apiUrl}/pagar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cuotaId: cuotaId, adminId: usuario.id })
                });

                if (response.ok) {
                    alert('¡Pago registrado con éxito!');
                    buscarDeudas(); // Recargamos la lista
                } else {
                    alert('Hubo un problema al procesar el pago.');
                }
            } catch (error) {
                console.error("Error al pagar:", error);
            }
        }
    </script>
</body>
</html>
