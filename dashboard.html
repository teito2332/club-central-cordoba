<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Central Córdoba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">Club Central Córdoba</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="nombreUsuario">Cargando...</span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Portal de Gestión</h2>
        
        <div class="row" id="menuOpciones">
            <!-- Las tarjetas se generan dinámicamente según el rol -->
        </div>
    </div>

    <script>
        // 1. Verificar si el usuario está logueado
        const usuario = JSON.parse(localStorage.getItem('usuarioClub'));
        
        if (!usuario) {
            window.location.href = 'index.html'; // Si no hay usuario, lo patea al login
        } else {
            // Mostrar nombre
            document.getElementById('nombreUsuario').textContent = `${usuario.nombre} ${usuario.apellido}`;
            
            // 2. Renderizar menú según el Rol (1 = Admin, 2 = Profe, 3 = Jugador)
            const menu = document.getElementById('menuOpciones');
            let tarjetasHTML = '';

            if (usuario.rolId === 1) {
                tarjetasHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100 shadow-sm border-0 text-center p-4">
                            <h4>💰 Cuotas y Pagos</h4>
                            <p class="text-muted">Consulta deudas y registra pagos de socios e inferiores.</p>
                            <a href="cuotas.html" class="btn btn-primary mt-auto">Gestionar Cuotas</a>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card h-100 shadow-sm border-0 text-center p-4">
                            <h4>📰 Web y Noticias</h4>
                            <p class="text-muted">Publica novedades y gestiona la página principal del club.</p>
                            <a href="gestionar_web.html" class="btn btn-dark mt-auto">Redactar Noticia</a>
                        </div>
                    </div>`;
            }
            
            if (usuario.rolId === 2 || usuario.rolId === 1) { // Profe o Admin
                tarjetasHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100 shadow-sm border-0 text-center p-4">
                            <h4>📋 Asistencias</h4>
                            <p class="text-muted">Pasar lista a los jugadores de las categorías.</p>
                            <a href="asistencias.html" class="btn btn-success mt-auto">Tomar Asistencia</a>
                        </div>
                    </div>`;
            }

            if (usuario.rolId === 3) {
                tarjetasHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100 shadow-sm border-0 text-center p-4">
                            <h4>👤 Mi Perfil</h4>
                            <p class="text-muted">Revisar mi estado de cuenta y asistencias.</p>
                            <button class="btn btn-info mt-auto text-white">Ver mi estado</button>
                        </div>
                    </div>`;
            }

            menu.innerHTML = tarjetasHTML;
        }

        // 3. Función para salir
        function cerrarSesion() {
            localStorage.removeItem('usuarioClub');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
