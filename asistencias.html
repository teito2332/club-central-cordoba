<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias - Central Córdoba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: bold; }
        .attendance-radio { transform: scale(1.3); cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">⬅ Volver al Panel</a>
            <span class="text-white" id="nombreProfe">Cargando...</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="mb-4">📋 Tomar Asistencia</h3>
                        
                        <!-- Controles de búsqueda y Fecha -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-5">
                                <label class="form-label">ID de Categoría</label>
                                <div class="input-group">
                                    <!-- Dejamos el 1 por defecto (Cuarta División de prueba) -->
                                    <input type="number" id="inputIdCategoria" class="form-control" value="1" placeholder="Ej: 1">
                                    <button class="btn btn-success" onclick="cargarPlantel()">Cargar</button>
                                </div>
                            </div>
                            <div class="col-md-4 offset-md-3">
                                <label class="form-label">Fecha del Entrenamiento</label>
                                <input type="date" id="inputFecha" class="form-control">
                            </div>
                        </div>

                        <!-- Contenedor de Alertas -->
                        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

                        <!-- Formulario de Asistencia Masiva -->
                        <form id="formAsistencia" class="d-none">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="tablaAsistencia">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Jugador</th>
                                            <th class="text-center">Presente</th>
                                            <th class="text-center text-danger">Ausente</th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoTabla">
                                        <!-- Las filas se llenan dinámicamente -->
                                    </tbody>
                                </table>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Asistencia del Día</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Verificamos si es Profe (Rol 2) o Admin (Rol 1)
        const usuario = JSON.parse(localStorage.getItem('usuarioClub'));
        if (!usuario || (usuario.rolId !== 1 && usuario.rolId !== 2)) {
            alert("Acceso denegado. Solo profesores o administradores.");
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('nombreProfe').textContent = `Usuario: ${usuario.nombre}`;
        }

        // Setear la fecha actual por defecto en el calendario
        document.getElementById('inputFecha').valueAsDate = new Date();

        const apiUrl = 'https://localhost:7289/api/Asistencias';
        let listaJugadores = []; // Guardaremos los IDs para procesarlos al final

        // 2. Función para buscar a los jugadores de la categoría
        async function cargarPlantel() {
            const categoriaId = document.getElementById('inputIdCategoria').value;
            const alerta = document.getElementById('mensajeAlerta');
            const form = document.getElementById('formAsistencia');
            const tbody = document.getElementById('cuerpoTabla');

            if (!categoriaId) return;

            try {
                const response = await fetch(`${apiUrl}/plantel/${categoriaId}`);
                const data = await response.json();

                tbody.innerHTML = ''; 
                listaJugadores = data; // Guardamos los datos para usarlos al mandar el POST

                if (data && data.length > 0) {
                    alerta.classList.add('d-none');
                    form.classList.remove('d-none');

                    data.forEach(jugador => {
                        // Por defecto marcamos a todos como "Presente" para ahorrarle tiempo al profe
                        const fila = `
                            <tr>
                                <td><strong>${jugador.apellido}</strong>, ${jugador.nombre}</td>
                                <td class="text-center">
                                    <input class="form-check-input attendance-radio text-success" type="radio" name="estado_${jugador.id}" value="Presente" checked>
                                </td>
                                <td class="text-center">
                                    <input class="form-check-input attendance-radio text-danger" type="radio" name="estado_${jugador.id}" value="Ausente">
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += fila;
                    });
                } else {
                    alerta.className = 'alert alert-warning mt-3';
                    alerta.textContent = 'No hay jugadores registrados en esta categoría.';
                    alerta.classList.remove('d-none');
                    form.classList.add('d-none');
                }
            } catch (error) {
                console.error("Error al buscar plantel:", error);
                alerta.className = 'alert alert-danger mt-3';
                alerta.textContent = 'Error de conexión con el servidor.';
                alerta.classList.remove('d-none');
            }
        }

        // 3. Función para enviar toda la lista a la base de datos
        document.getElementById('formAsistencia').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const categoriaId = document.getElementById('inputIdCategoria').value;
            const fecha = document.getElementById('inputFecha').value;
            
            // Recorremos la lista de jugadores y vemos qué bolita (radio) está marcada
            const jugadoresAsistencia = listaJugadores.map(jugador => {
                const radios = document.getElementsByName(`estado_${jugador.id}`);
                let estadoSeleccionado = "Presente";
                
                for (const radio of radios) {
                    if (radio.checked) {
                        estadoSeleccionado = radio.value;
                        break;
                    }
                }
                
                return {
                    usuarioId: jugador.id,
                    estado: estadoSeleccionado
                };
            });

            // Armamos el JSON exactamente como lo programamos en C#
            const requestBody = {
                categoriaId: parseInt(categoriaId),
                profesorId: usuario.id,
                fecha: fecha,
                jugadores: jugadoresAsistencia
            };

            try {
                const response = await fetch(`${apiUrl}/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (response.ok) {
                    alert('¡Lista de asistencia guardada correctamente!');
                    window.location.href = 'dashboard.html'; // Volvemos al panel principal
                } else {
                    alert('Hubo un error al guardar la lista en la base de datos.');
                }
            } catch (error) {
                console.error("Error al registrar:", error);
            }
        });
    </script>
</body>
</html>
